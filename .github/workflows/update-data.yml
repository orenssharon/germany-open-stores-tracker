name: Update Open Stores Data

on:
  schedule:
    - cron: '0 4 * * *' # הרצה יומית בשעה 04:00 AM UTC
  workflow_dispatch: # מאפשר הרצה ידנית מתוך GitHub במקרה הצורך

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit & Push updated data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: data.json" && git push)
